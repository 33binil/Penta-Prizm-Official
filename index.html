<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO (defaults — overridden dynamically per-page via SEOHead.jsx) -->
    <title>Penta Prizm | Branding, Content, Digital &amp; Tech</title>
    <meta
      name="description"
      content="Penta Prizm is a creative and technology-driven company offering branding, content creation, video production, web development, app development, marketing, and digital marketing solutions."
    />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    <link rel="canonical" href="https://pentaprizm.in/" />

    <!-- Google Search Console Verification (set VITE_GSC_VERIFICATION in .env) -->
    <!-- <meta name="google-site-verification" content="YOUR_VERIFICATION_CODE_HERE" /> -->

    <meta name="theme-color" content="#0c0c0c" />
    <meta name="color-scheme" content="dark" />
    <meta name="author" content="PENTA PRIZM" />
    <meta
      name="keywords"
      content="PENTA PRIZM, Branding, Creative Studio, Content Creation, Video Production, Web Development, App Development, Digital Marketing, Marketing, Kochi, Kerala"

    <!-- Favicons & App Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <script>
      if ('scrollRestoration' in history) {
        history.scrollRestoration = 'manual';
      }
      window.scrollTo(0, 0);
    </script>

    <!-- Open Graph / Social Media -->
    <meta property="og:title" content="Penta Prizm | Branding, Content, Digital &amp; Tech" />

      property="og:description"
      content="We build brands, create content, and develop digital experiences through branding, video production, web &amp; app development, marketing, and digital solutions."

    <meta property="og:url" content="https://pentaprizm.in/" />

    <meta property="og:site_name" content="PENTA PRIZM" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Penta Prizm | Branding, Content, Digital &amp; Tech" />
    <meta
      name="twitter:description"
      content="Creative ideas. Powerful brands. Digital experiences. PENTA PRIZM brings branding, content, technology, and digital growth together."
    />
    <meta name="twitter:image" content="https://pentaprizm.in/Hero.png" />

    <meta name="geo.placename" content="Kochi, Kerala, India" />

    />
